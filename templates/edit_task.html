{% extends "base.html" %}

{% block title %}Edit Task - TaskMate{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card border-0 shadow-sm">

            <div class="card-body p-4">

                <h3 class="fw-bold mb-1">
                    Edit Task
                </h3>

                <p class="text-muted mb-4">
                    Update your task details.
                </p>


                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Task Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            value="{{ task['title'] }}"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="4"
                        >{{ task['description'] or '' }}</textarea>

                    </div>


                    <div class="row">

                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                Subject
                            </label>

                            <input
                                type="text"
                                name="subject"
                                class="form-control"
                                value="{{ task['subject'] or '' }}"
                            >

                        </div>


                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                Priority
                            </label>

                            <select
                                name="priority"
                                class="form-select"
                            >

                                <option
                                    value="High"
                                    {% if task['priority'] == 'High' %}selected{% endif %}
                                >
                                    High
                                </option>

                                <option
                                    value="Medium"
                                    {% if task['priority'] == 'Medium' %}selected{% endif %}
                                >
                                    Medium
                                </option>

                                <option
                                    value="Low"
                                    {% if task['priority'] == 'Low' %}selected{% endif %}
                                >
                                    Low
                                </option>

                            </select>

                        </div>


                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                Due Date
                            </label>

                            <input
                                type="date"
                                name="due_date"
                                class="form-control"
                                value="{{ task['due_date'] or '' }}"
                            >

                        </div>

                    </div>


                    <div class="d-flex gap-2">

                        <button class="btn btn-primary">
                            Save Changes
                        </button>

                        <a
                            href="{{ url_for('dashboard') }}"
                            class="btn btn-light"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
