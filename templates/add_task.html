{% extends "base.html" %}

{% block title %}Add Task - TaskMate{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card border-0 shadow-sm">

            <div class="card-body p-4">

                <h3 class="fw-bold mb-1">
                    Add New Task
                </h3>

                <p class="text-muted mb-4">
                    Create a personal task for your study or daily work.
                </p>


                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Task Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            placeholder="e.g. Complete DBMS Assignment"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="4"
                            placeholder="Enter task details..."
                        ></textarea>

                    </div>


                    <div class="row">

                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                Subject
                            </label>

                            <input
                                type="text"
                                name="subject"
                                class="form-control"
                                placeholder="DBMS"
                            >

                        </div>


                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                Priority
                            </label>

                            <select
                                name="priority"
                                class="form-select"
                            >

                                <option value="High">
                                    High
                                </option>

                                <option value="Medium" selected>
                                    Medium
                                </option>

                                <option value="Low">
                                    Low
                                </option>

                            </select>

                        </div>


                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                Due Date
                            </label>

                            <input
                                type="date"
                                name="due_date"
                                class="form-control"
                            >

                        </div>

                    </div>


                    <div class="d-flex gap-2">

                        <button class="btn btn-primary">
                            Add Task
                        </button>

                        <a
                            href="{{ url_for('dashboard') }}"
                            class="btn btn-light"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
