{% extends "base.html" %}

{% block title %}Register - TaskMate{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="text-center mb-4">

            <div class="logo-circle">
                🎓
            </div>

            <h2 class="fw-bold mt-3">
                Create Account
            </h2>

            <p class="text-muted">
                Start managing your student tasks
            </p>

        </div>


        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >

            </div>


            <button class="btn btn-primary w-100 py-2">
                Create Account
            </button>

        </form>


        <p class="text-center mt-4 mb-0">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
