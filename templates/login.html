{% extends "base.html" %}

{% block title %}Login - TaskMate{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="text-center mb-4">

            <div class="logo-circle">
                🎓
            </div>

            <h2 class="fw-bold mt-3">
                TaskMate
            </h2>

            <p class="text-muted">
                Student Productivity Manager
            </p>

        </div>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button class="btn btn-primary w-100 py-2">
                Login
            </button>

        </form>


        <p class="text-center mt-4 mb-0">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </p>

    </div>

</div>

{% endblock %}
